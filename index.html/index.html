<style>
:root{--ink:#14233b;--paper:#f3f6fa;--card:#fff;--line:#d5dce8;--red:#d2392f;--blue:#2a5db0;--ok:#2e8b6a;--mute:#5d6b82;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eef9;--paper:#0f1828;--card:#17233a;--line:#2a3a57;--red:#ee6a60;--blue:#7ba6ee;--ok:#5cc7a0;--mute:#9aa9c2}}
:root[data-theme="dark"]{--ink:#e8eef9;--paper:#0f1828;--card:#17233a;--line:#2a3a57;--red:#ee6a60;--blue:#7ba6ee;--ok:#5cc7a0;--mute:#9aa9c2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,var(--paper) 14px 24px,var(--blue) 24px 38px,var(--paper) 38px 48px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:600;margin:24px 0 8px;color:var(--blue)}
p.sub{margin:0 0 20px;color:var(--mute)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
input,select{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 4px}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types button{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
.types button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.trip{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.trip b{font-size:1.1rem}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none;padding:0}
.item span{flex:1}
.item.done span{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:1.3rem;padding:4px 8px}
.empty{color:var(--mute);padding:16px 0;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
textarea{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug button{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px}
#map{height:300px;border-radius:10px;margin-top:12px;display:none;z-index:0}
.wx{margin-top:8px;color:var(--mute)}
.weather-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.weather-day{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 7px;text-align:center}
.weather-day b{display:block;font-size:.88rem}
.weather-day .temp{font-size:1.05rem;font-weight:800;margin:5px 0}
.weather-day small{display:block;color:var(--mute);font-size:.78rem}
.route-stop{display:grid;grid-template-columns:minmax(0,1fr) 112px auto 36px;gap:7px;align-items:center;margin:8px 0}
.route-stop input,.route-stop select{padding:8px}
.route-stop .x{font-size:1.2rem}.route-booked{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:.78rem;color:var(--mute)}.route-booked input{width:16px;height:16px;accent-color:var(--ok)}
@media(max-width:520px){.route-stop{grid-template-columns:minmax(0,1fr) 36px}.route-stop .stop-mode{grid-column:1}.route-stop .route-booked{grid-column:1}.route-stop .x{grid-column:2;grid-row:1}}
.route-line{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.88rem;padding:3px 0}
.route-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item-icon{width:28px;flex:none;text-align:center;font-size:1.15rem}
.item .item-text{flex:1;min-width:0}.category-group{margin:10px 0}.category-group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 2px;color:var(--blue);font-weight:700}.category-group summary::-webkit-details-marker{display:none}.category-group summary:after{content:'▾';margin-left:auto}.category-group:not([open]) summary:after{content:'▸'}
.item .item-text label{overflow-wrap:anywhere}
.cat-title{display:flex;align-items:center;gap:8px}
@media print{
 body{background:#fff!important;color:#111!important}
 .stripe,#lg,.top button,#add,.route-tools,#reset,.x,.btn,.sug,#map{display:none!important}
 main{max-width:none;padding:0}
 .card,.trip{break-inside:avoid;border:1px solid #ccc;background:#fff!important;color:#111!important}
 .item{break-inside:avoid}
 input[type=checkbox]{print-color-adjust:exact}
 .weather-grid{break-inside:avoid}
}

<body>
<div class="stripe"></div>
<div style="max-width:560px;margin:0 auto;padding:10px 16px 0;text-align:right"><button class="btn ghost" id="lg" type="button" style="padding:6px 12px"></button></div>
<main id="app"></main>
<script>
const T={
 "Hiking":{e:"🥾",i:[["Hiking shoes","Clothes"],["Hiking pants","Clothes"],["Hiking shirts","Clothes",0.5],["Hiking socks","Clothes",0.7],["Underwear","Clothes",1],["Rain jacket","Clothes"],["Hat (sun or hiking)","Clothes"],["Water bottle","Gear"],["First-aid kit","Gear"],["Headlamp","Gear"],["Offline maps","Tech"],["Snacks","Gear"],["Sun cream","Toiletries"]]},
 "Travel":{e:"🌍",i:[["Travel insurance papers","Documents"],["Driver’s licence","Documents"],["T-shirts","Clothes",0.7],["Casual pants or shorts","Clothes",0.4],["Sweater or pullover","Clothes"],["Jacket or coat","Clothes"],["Pyjamas","Clothes"],["Underwear","Clothes",1],["Socks","Clothes",1],["Comfortable shoes","Clothes"],["Swimsuit or trunks","Clothes"],["Hat (sun or hiking)","Clothes"],["Power adapter","Tech"],["Power bank","Tech"],["Earphones + charger","Tech"],["Sunglasses","Gear"],["Umbrella","Gear"],["Travel locks","Gear"],["Water bottle","Gear"],["Laundry bag","Gear"],["Day bag","Gear"],["Snacks","Gear"],["Shampoo and conditioner","Toiletries"],["Soap or body wash","Toiletries"],["Comb","Toiletries"],["Razor","Toiletries"],["Tissues and wet wipes","Toiletries"],["Dental floss","Toiletries"],["Nail clippers","Toiletries"],["Sun cream","Toiletries"],["Take out the trash","Before leaving"],["Water the plants","Before leaving"],["Switch off appliances","Before leaving"],["Lock doors and windows","Before leaving"]]},
 "Camping":{e:"⛺",i:[["Campsite booking","Documents"],["T-shirts","Clothes",0.7],["Casual pants or shorts","Clothes",0.4],["Sweater or pullover","Clothes"],["Rain jacket","Clothes"],["Underwear","Clothes",1],["Socks","Clothes",1],["Hiking shoes","Clothes"],["Sandals","Clothes"],["Hat (sun or hiking)","Clothes"],["Tent","Gear"],["Sleeping bag","Gear"],["Sleeping mat","Gear"],["Headlamp","Gear"],["Lighter","Gear"],["Trash bags","Gear"],["Camping stove and fuel","Gear"],["Water bottle","Gear"],["First-aid kit","Gear"],["Quick-dry towel","Gear"],["Cookware","Kitchen"],["Plates and cutlery","Kitchen"],["Cups","Kitchen"],["Kitchen paper","Kitchen"],["Dish soap and sponge","Kitchen"],["Food and snacks","Kitchen"],["Salt and cooking oil","Kitchen"],["Power bank","Tech"],["Sun cream","Toiletries"],["Insect repellent","Toiletries"]]},
 "Fluglager":{e:"🛩️",i:[["Licences (SPL, BZF, medical)","Documents"],["ICAO chart","Documents"],["Flying shoes","Clothes"],["Flying pants","Clothes"],["Anti-UV jacket","Clothes"],["Sun protection sleeves","Clothes"],["Sun hat","Clothes"],["Flying backpack","Gear"],["Hydration bladder","Gear"],["Water bottle","Gear"],["Adhesive tape","Gear"],["Scissors","Gear"],["Sunglasses","Gear"],["Phone holder (flying)","Tech"],["SD card + card reader","Tech"],["Action camera + batteries + SIM cards + charger","Tech"],["Sun cream","Toiletries"],["Anti-UV lip balm","Toiletries"]]},
 "Snowboarding":{e:"🏂",i:[["Lift pass","Documents"],["Snowboard jacket","Clothes"],["Snowboard pants","Clothes"],["Thermal layers","Clothes",0.7],["Snowboard socks","Clothes",0.7],["Underwear","Clothes",1],["Gloves","Clothes"],["Beanie","Clothes"],["Neck gaiter","Clothes"],["Board and boots","Gear"],["Helmet","Gear"],["Goggles","Gear"],["Wrist guards","Gear"],["Sun cream","Toiletries"],["Lip balm","Toiletries"]]},
 "New Zealand":{e:"🥝",i:[["NZeTA (if required)","Documents"],["International driving permit","Documents"],["Travel insurance papers","Documents"],["Hut or campsite bookings","Documents"],["Declare outdoor gear and food on arrival","Documents"],["T-shirts","Clothes",0.6],["Hiking shirts","Clothes",0.5],["Merino base layers","Clothes",0.5],["Casual pants or shorts","Clothes",0.3],["Hiking pants","Clothes"],["Fleece or warm layer","Clothes"],["Rain jacket","Clothes"],["Rain pants","Clothes"],["Warm hat and gloves","Clothes"],["Hat (sun or hiking)","Clothes"],["Hiking shoes","Clothes"],["Sandals","Clothes"],["Swimsuit or trunks","Clothes"],["Underwear","Clothes",1],["Hiking socks","Clothes",1],["Day pack","Gear"],["Dry bag","Gear"],["Water bottle","Gear"],["Headlamp","Gear"],["First-aid kit","Gear"],["Quick-dry towel","Gear"],["Sunglasses","Gear"],["Power adapter (type I)","Tech"],["Power bank","Tech"],["Offline maps","Tech"],["Sun cream","Toiletries"],["Insect repellent","Toiletries"],["Lip balm","Toiletries"],["Clean boots and outdoor gear (NZ biosecurity)","Before leaving"]]}
};
let C={};
try{const r=localStorage.getItem("packing-shared-types-v1");if(r)C=JSON.parse(r)||{}}catch(e){}
const saveC=()=>{try{localStorage.setItem("packing-shared-types-v1",JSON.stringify(C))}catch(e){}};
const all=()=>({...T,...C});
const em=n=>(all()[String(n).split(" + ")[0]]||{e:"🧳"}).e;
const BASE=[["Passport or ID card","Documents"],["Tickets and bookings","Documents"],["Wallet and cards","Documents"],["Keys","Gear"],["Phone and charger","Tech"],["Toothbrush and toothpaste","Toiletries"],["Deodorant","Toiletries"],["Medication","Toiletries"]];
const CATS=["Documents","Clothes","Toiletries","Tech","Gear","Kitchen","Before leaving"];
let S={trips:[],cur:null,form:{types:["Travel"]}};
try{const r=localStorage.getItem("packing-shared-v1");if(r)S.trips=JSON.parse(r)||[]}catch(e){}
const save=()=>{try{localStorage.setItem("packing-shared-v1",JSON.stringify(S.trips))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

function mk(days,types){
 const m=new Map();
 const put=(t,c,p)=>{const k=t.toLowerCase(),o=m.get(k);if(o){if(p&&(!o.p||p>o.p))o.p=p;return}m.set(k,{t,c,p})};
 BASE.forEach(([t,c])=>put(t,c));
 types.forEach(ty=>(all()[ty]||{i:[]}).i.forEach(([t,c,p])=>put(t,c,p)));
 return [...m.values()].map(o=>({id:uid(),t:o.p?o.t+" ×"+Math.max(1,Math.ceil(days*o.p)):o.t,c:o.c,d:false}));
}
function build(name,days,types){return{id:uid(),name,days,type:types.join(" + ")||"Essentials",items:mk(days,types)}}
function pct(t){return t.items.length?Math.round(t.items.filter(i=>i.d).length/t.items.length*100):0}

function home(){
 const a=$("app"),F=S.form;
 a.innerHTML=`<h1>Packing lists</h1><p class="sub">One list for every trip.</p>
 ${S.trips.length?S.trips.map(t=>`<button class="trip" data-open="${t.id}"><b>${em(t.type)} ${esc(t.name)}</b><div style="color:var(--mute)">${t.days} days · ${t.items.filter(i=>i.d).length} of ${t.items.length} packed${t.sd?" · "+cdTxt(t):""}</div><div class="bar"><i style="width:${pct(t)}%"></i></div></button>`).join(""):`<div class="empty">No trips yet. Plan your first one below.</div>`}
 <h2>New trip</h2>
 <div class="card">
  <label for="n">Trip name</label><input id="n" placeholder="Lisbon in May" maxlength="40">
  <label for="dd">Destination (for weather and map)</label><input id="dd" placeholder="Lisbon" maxlength="60">
  <label for="d">Number of days</label><input id="d" type="number" min="1" max="60" value="5" inputmode="numeric">
  <label for="sd">Travel start date</label><input id="sd" type="date">
  <label for="ed">Travel end date</label><input id="ed" type="date">
  <label>Trip types (choose one or more to combine)</label>
  <div class="types">${Object.keys(all()).map(k=>`<span class="row" style="gap:0"><button type="button" data-type="${esc(k)}" aria-pressed="${F.types.includes(k)}">${em(k)} ${esc(k)}</button>${C[k]?`<button type="button" class="x" data-deltype="${esc(k)}" aria-label="${T[k]?"Restore original":"Delete"} type ${esc(k)}">${T[k]?"↺":"×"}</button>`:""}</span>`).join("")}</div>
  ${typeEd()}
  <p style="color:var(--mute);font-size:.9rem;margin:12px 0">Clothing quantities adjust to the trip length. Items that appear in several types are listed once.</p>
  <button class="btn" id="create">Create list</button>
 </div>`;
 const keep=()=>{F.name=$("n").value;F.dest=$("dd").value;F.days=$("d").value;F.sd=$("sd").value;F.ed=$("ed").value};
 $("n").value=F.name||"";$("dd").value=F.dest||"";$("d").value=F.days||5;$("sd").value=F.sd||"";$("ed").value=F.ed||"";
 $("sd").onchange=$("ed").onchange=()=>{const x=$("sd").value,y=$("ed").value;if(x&&y){const n=Math.round((new Date(y+"T00:00:00")-new Date(x+"T00:00:00"))/864e5)+1;if(n>=1)$("d").value=Math.min(60,n)}};
 a.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.cur=b.dataset.open;trip()});
 a.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{keep();const k=b.dataset.type;F.types=F.types.includes(k)?F.types.filter(x=>x!==k):[...F.types,k];home()});
 if($("nt"))$("nt").onclick=()=>{keep();F.edit="__new";home();$("tn").focus()};
 if($("et"))$("et").onclick=()=>{keep();F.edit=F.types[0];home();$("ti").focus()};
 if($("ct"))$("ct").onclick=()=>{keep();F.edit="";home()};
 if($("st"))$("st").onclick=()=>{
  const isNew=F.edit==="__new",nm=isNew?$("tn").value.trim():F.edit;
  if(!nm){$("tn").focus();return}
  if(isNew&&all()[nm]){alert("A type with that name already exists. Choose another name.");return}
  const items=$("ti").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
   let c="Gear",p=0;const m=l.match(/^([A-Za-z ]+?):\s*(.+)$/);
   if(m){const k=CATS.find(x=>[x,DECAT[x]].some(y=>y&&y.toLowerCase()===m[1].trim().toLowerCase()));if(k){c=k;l=m[2]}}
   const pm=l.match(/\*(\d*\.?\d+)?$/);if(pm){p=pm[1]?parseFloat(pm[1]):1;l=l.slice(0,pm.index).trim()}
   return l?(p?[l,c,p]:[l,c]):null}).filter(Boolean);
  C[nm]={e:$("te").value.trim()||"✨",i:items};saveC();keep();
  if(isNew)F.types=[...F.types,nm];
  F.edit="";home();
 };
 a.querySelectorAll("[data-deltype]").forEach(b=>b.onclick=()=>{const k=b.dataset.deltype;
  if(confirm(T[k]?"Restore the original “"+k+"” list?":"Delete the type “"+k+"”? Existing trips keep their lists.")){
   delete C[k];saveC();keep();if(!T[k])F.types=F.types.filter(x=>x!==k);if(F.edit===k)F.edit="";home()}});
 $("create").onclick=()=>{
  const name=$("n").value.trim()||F.types.join(" + ")||"My trip";
  const days=Math.min(60,Math.max(1,parseInt($("d").value)||5));
  const t=build(name,days,F.types);t.dest=$("dd").value.trim();t.sd=$("sd").value;t.ed=$("ed").value;
  if(t.sd&&t.ed&&t.ed<t.sd)t.ed=t.sd;
  S.trips.unshift(t);save();S.cur=t.id;S.form={types:F.types};trip();
 };
}
function trip(){
 const t=S.trips.find(x=>x.id===S.cur);if(!t)return home();
 const a=$("app");
 const groups=CATS.map(c=>[c,t.items.filter(i=>i.c===c)]).filter(g=>g[1].length);
 a.innerHTML=`<div class="top"><button class="btn ghost" id="back">Back</button><button class="btn ghost" id="del">Delete trip</button></div>
 <h1>${em(t.type)} ${esc(t.name)}</h1>
 <p class="sub">${t.days} days · <span id="pc">${pct(t)}</span>% packed</p>
 ${cdCard(t)}
 <div class="bar" style="margin:-8px 0 8px;height:10px"><i id="pb" style="width:${pct(t)}%"></i></div>
 ${wxCard(t)}
 ${groups.length?groups.map(([c,list])=>`<details class="category-group" open><summary>${CATEMOJI[c]||"📦"} ${esc(LANG==="de"?(DECAT[c]||c):c)} <small style="color:var(--mute);font-weight:400">(${list.length})</small></summary><div class="card" style="padding:4px 14px">${list.map(i=>`<div class="item ${i.d?"done":""}"><input type="checkbox" id="c${i.id}" data-id="${i.id}" ${i.d?"checked":""}><span class="item-icon">${itemEmoji(i.t)}</span><span class="item-text"><label for="c${i.id}" style="margin:0;color:inherit;font-size:1rem;cursor:pointer">${esc(i.t)}</label></span><button class="x" data-rm="${i.id}" aria-label="Remove ${esc(i.t)}">×</button></div>`).join("")}</div></details>`).join(""):`<div class="empty">This list is empty. Add your first item below.</div>`}
 <h2>Add an item</h2>
 <div class="card"><div class="row"><input id="ni" placeholder="Travel pillow" maxlength="60" aria-label="Item name"><select id="nc" style="width:auto" aria-label="Category">${CATS.map(c=>`<option value="${c}">${categoryLabel(c)}</option>`).join("")}</select></div>
 <button class="btn" id="add" style="margin-top:10px">Add item</button></div>
 <h2>Add a whole type</h2>
 <div class="card"><div class="row"><select id="mt" aria-label="Trip type">${Object.keys(all()).map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join("")}</select><button class="btn" id="mg" style="flex:none">Add</button></div><p class="wx" style="margin:8px 0 0">Items already on your list are skipped.</p></div>

 [/^Remove (.+)$/,(m,x)=>tx(x)+" entfernen"],
 [/^Delete type (.+)$/,(m,x)=>"Reiseart "+tx(x)+" löschen"],
 [/^Restore original type (.+)$/,(m,x)=>"Original von "+tx(x)+" wiederherstellen"],
 [/^Edit “(.+)”$/,(m,x)=>"„"+tx(x)+"“ bearbeiten"],
 [/^Delete “(.+)”\?$/,(m,x)=>"„"+x+"“ löschen?"],
 [/^Delete the type “(.+)”\? Existing trips keep their lists\.$/,(m,x)=>"Reiseart „"+x+"“ löschen? Bestehende Reisen behalten ihre Listen."],
 [/^Restore the original “(.+)” list\?$/,(m,x)=>"Originalliste „"+tx(x)+"“ wiederherstellen?"],
 [/^\+ (.+)$/,(m,x)=>"+ "+tx(x)]
];
function tx(s){
 if(LANG!=="de"||!s)return s;
 const d=DE[s];if(typeof d==="string")return d;
 if(/°C, rain chance up to/.test(s))return s.replace(/Next (\d+) days?/,(m,n)=>n==="1"?"Nächster Tag":"Nächste "+n+" Tage").replace("Your trip dates","Deine Reisedaten").replace("(first days)","(erste Tage)").replace("(your dates are too far ahead for a forecast)","(deine Reisedaten liegen noch zu weit in der Zukunft)").replace(/° to (-?\d+)°C, rain chance up to (\d+)%/,"° bis $1°C, Regenwahrscheinlichkeit bis zu $2 %");
 let m;
 for(const [re,f] of RULES){if(m=s.match(re))return f(...m)}
 if(m=s.match(/^(.+?) ×(\d+)$/)){const b=tx(m[1]);if(b!==m[1])return b+" ×"+m[2]}
 if(s.includes(" + ")){const p=s.split(" + "),q=p.map(tx);if(q.some((x,i)=>x!==p[i]))return q.join(" + ")}
 if(m=s.match(/^([^\p{L}\p{N}]+)\s+(.+)$/u)){const r=tx(m[2]);if(r!==m[2])return m[1]+" "+r}
 return s;
}
const SKIP=new Set(["TEXTAREA","SCRIPT","STYLE"]);
function walk(root){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){if(SKIP.has(n.parentNode.nodeName))continue;const v=n.nodeValue,c=v.trim();if(!c)continue;const r=tx(c);if(r!==c)n.nodeValue=v.replace(c,()=>r)}
 root.querySelectorAll("[placeholder],[aria-label]").forEach(e=>{
  const p=e.getAttribute("placeholder");if(p){const r=PH[p]||tx(p);if(r!==p)e.setAttribute("placeholder",r)}
  const a=e.getAttribute("aria-label");if(a){const r=tx(a);if(r!==a)e.setAttribute("aria-label",r)}});
}
const _c=window.confirm.bind(window),_a=window.alert.bind(window);
window.confirm=m=>_c(tx(m));window.alert=m=>_a(tx(m));
const obs=new MutationObserver(()=>{if(LANG!=="de")return;obs.disconnect();walk($("app"));obs.observe($("app"),{childList:true,characterData:true,subtree:true})});
obs.observe($("app"),{childList:true,characterData:true,subtree:true});

$("lg").onclick=()=>{LANG=LANG==="de"?"en":"de";try{localStorage.setItem("packing-lang",LANG)}catch(e){}setLang();S.cur?trip():home()};
setLang();
home();
